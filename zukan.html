        // ==========================================
        // 2. レンダリングエンジン（データを元にHTMLを自動生成）
        // ==========================================
        function renderZukan() {
            const container = document.getElementById('zukanContainer');
            let htmlContent = '';

            zukanData.forEach(section => {
                htmlContent += `
                    <div class="section-block js-section">
                        <div class="section-title ${section.colorClass}">${section.category}</div>
                        <div class="zukan-list">
                `;
                
                section.items.forEach(item => {
                    htmlContent += `
                        <div class="zukan-card" data-keyword="${item.keyword}">
                            <div class="avatar-zone ${item.avatarClass}">${item.avatarIcon}</div>
                            <div class="info-zone">
                                <div class="name-row">
                                    <span class="main-abbr">${item.mainAbbr}</span>
                                    <span class="sub-jp">${item.subJp}</span>
                                </div>
                                <p class="desc-text">${item.desc}</p>
                                <div class="trap-box">
                                    <span class="trap-label">⚠️ 医療事務の実務チェック！</span>
                                    <p class="trap-text">${item.trapText}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                htmlContent += `</div></div>`;
            });

            container.innerHTML = htmlContent;
        }

        // ==========================================
        // 3. 検索機能
        // ==========================================
        function searchZukan() {
            const input = document.getElementById('zukanSearch').value.toLowerCase().trim();
            const cards = document.querySelectorAll('.zukan-card');
            const sections = document.querySelectorAll('.js-section');
            const noResults = document.getElementById('noResultsMessage');
            
            let totalVisible = 0;

            cards.forEach(card => {
                const keyword = card.getAttribute('data-keyword').toLowerCase();
                if (keyword.includes(input)) {
                    card.style.display = 'flex';
                    totalVisible++;
                } else {
                    card.style.display = 'none';
                }
            });

            sections.forEach(section => {
                const visibleCardsInside = section.querySelectorAll('.zukan-card[style="display: flex;"]');
                if (visibleCardsInside.length === 0 && input !== "") {
                    section.style.display = 'none';
                } else {
                    section.style.display = 'block';
                }
            });

            if (totalVisible === 0) {
                noResults.style.display = 'block';
            } else {
                noResults.style.display = 'none';
            }
        }

        // 画面読み込み時にレンダリングを実行
        document.addEventListener('DOMContentLoaded', renderZukan);
    </script>
