            { id: "SHO-014", genre: "手術・処置", name: "堺 雅人 様", desc: "眼処置", icon: "👁️", color: "amber", scenario: "結膜炎で眼の洗浄と点眼を行いました。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "add", item: "眼処置", pts: 12, hint: "片眼・両眼関わらず12点。" }, { type: "finish" }] },
            { id: "SHO-015", genre: "手術・処置", name: "石原 さとみ 様", desc: "抜釘術（簡単なもの）", icon: "釘", color: "amber", scenario: "指に入っていた小さなピンを抜きました。", initial: [{n: "再診料", p: 73}], steps: [{ label: "手術", type: "add", item: "骨折非観血的整復術", pts: 0, ok: false, hint: "抜釘(K002)を算定します。露出している場合は処置扱いも。" }, { label: "算定", type: "add", item: "抜釘術", pts: 950, hint: "部位により950〜算定。" }, { type: "finish" }] },

            { id: "SHO-018", genre: "手術・処置", name: "菅田 将暉 様", desc: "胃洗浄", icon: "🚿", color: "amber", scenario: "中毒の疑いで胃洗浄を行いました。", initial: [{n: "初診料", p: 288}], steps: [{ label: "処置", type: "add", item: "胃洗浄", pts: 155, hint: "155点を算定。" }, { type: "finish" }] },
            { id: "SHO-019", genre: "手術・処置", name: "橋本 環奈 様", desc: "浣腸", icon: "🚽", color: "amber", scenario: "便秘解消のため浣腸を実施。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "add", item: "浣腸", pts: 27, hint: "27点。薬剤料は別途。" }, { type: "finish" }] },
            { id: "SHO-020", genre: "手術・処置", name: "ムロツヨシ 様", desc: "デブリードマン", icon: "✂️", color: "amber", scenario: "汚染された創傷の死滅組織を除去。", initial: [{n: "再診料", p: 73}, {n: "創傷処理", p: 470}], steps: [{ label: "加算", type: "add", item: "デブリードマン加算", pts: 100, hint: "最初の手術時、100点加算。" }, { type: "finish" }] },
            { id: "SHO-021", genre: "手術・処置", name: "小栗 旬 様", desc: "時間外手術加算", icon: "⏰", color: "amber", scenario: "夜20時に緊急で行った手術。", initial: [{n: "手術料", p: 1000}], steps: [{ label: "加算", type: "add", item: "時間外加算(40%)", pts: 400, hint: "休日・時間外・深夜で所定点数が加算されます。" }, { type: "finish" }] },
            { id: "SHO-022", genre: "手術・処置", name: "広瀬 すず 様", desc: "鼓膜穿刺", icon: "👂", color: "amber", scenario: "中耳炎で鼓膜に穴を開けて膿を出しました。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "add", item: "鼓膜穿刺", pts: 80, hint: "片耳につき80点。" }, { type: "finish" }] },
            { id: "SHO-023", genre: "手術・処置", name: "佐藤 健 様", desc: "尿道カテーテル留置", icon: "🏥", color: "amber", scenario: "バルーンカテーテルを留置しました。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "add", item: "尿道カテーテル留置", pts: 40, hint: "40点。特定保険医療材料（カテーテル）は別途。" }, { type: "finish" }] },
            { id: "SHO-024", genre: "手術・処置", name: "有村 架純 様", desc: "足指のテーピング", icon: "🩹", color: "amber", scenario: "指の捻挫に対し、テープで固定。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "add", item: "テープ固定", pts: 0, hint: "単なるテーピングは診察料に含まれることが多いです。" }, { type: "finish" }] },
            { id: "SHO-025", genre: "手術・処置", name: "竹内 涼真 様", desc: "鎖骨骨折の固定", icon: "🦴", color: "amber", scenario: "鎖骨骨折に対しクラビクルバンドを装着。", initial: [{n: "初診料", p: 288}], steps: [{ label: "処置", type: "add", item: "鎖骨骨折整復固定術", pts: 550, hint: "固定術として550点。" }, { type: "finish" }] },
            { id: "SHO-026", genre: "手術・処置", name: "浜辺 美波 様", desc: "口腔内善処置", icon: "👄", color: "amber", scenario: "口内炎への薬液塗布。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "check", hint: "処置料が発生しない軽微なものは診察料に含みます。" }, { type: "finish" }] },
            { id: "SHO-027", genre: "手術・処置", name: "横浜 流星 様", desc: "爪抜き（抜爪）", icon: "🦶", color: "amber", scenario: "剥がれかけた爪を完全に取り除きました。", initial: [{n: "再診料", p: 73}], steps: [{ label: "手術", type: "add", item: "抜爪", pts: 100, hint: "1指につき100点。" }, { type: "finish" }] },
            { id: "SHO-028", genre: "手術・処置", name: "今田 美桜 様", desc: "皮下血腫穿刺", icon: "💉", color: "amber", scenario: "打撲による血腫を穿刺して吸引しました。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "add", item: "血腫穿刺", pts: 60, hint: "60点を算定。" }, { type: "finish" }] },
            { id: "SHO-029", genre: "手術・処置", name: "志尊 淳 様", desc: "熱傷処置", icon: "🔥", color: "amber", scenario: "手のひらのやけど（100c㎡未満）の処置。", initial: [{n: "再診料", p: 73}], steps: [{ label: "処置", type: "add", item: "熱傷処置", pts: 135, hint: "重症度によりますが、初期は135点など。" }, { type: "finish" }] },
            { id: "SHO-030", genre: "手術・処置", name: "手術・処置マスター", icon: "🏆", color: "amber", scenario: "おめでとうございます！全ての算定の山を乗り越えました！", initial: [{n: "算定の極み", p: 100}], steps: [{ label: "グランドフィナーレ", type: "check", hint: "全150シナリオ、これにて完遂です！" }, { type: "finish" }] },
        ];

        const GENRES = ["外来算定", "画像・検査", "投薬・管理", "時間外・特例", "手術・処置"];

        // --- 2. エンジン部 ---
        let state = { view: 'portal', activeGenre: '外来算定', activeCase: null, step: 0, items: [], score: 0, isMobileMenuOpen: false };

        function render() {
            const root = document.getElementById('app-root');
            if (state.view === 'portal') {
                const filtered = SCENARIOS.filter(s => s.genre === state.activeGenre);
                root.innerHTML = `
                    <div class="md:hidden w-full bg-slate-900 text-white p-4 flex justify-between items-center fixed top-0 z-50">
                        <h1 class="font-black italic">CrossCare Hub v3.2</h1>
                        <button onclick="toggleMobileMenu()" class="text-2xl">☰</button>
                    </div>
                    <nav class="fixed inset-y-0 left-0 z-40 w-72 bg-slate-900 text-white flex flex-col transition-transform duration-300 transform ${state.isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 md:static shadow-2xl h-full">
                        <div class="p-8 border-b border-slate-800 hidden md:block">
                            <h1 class="text-2xl font-black tracking-tighter italic text-blue-500">CrossCare Hub</h1>
                        </div>
                        <div class="flex-grow py-8 md:py-4 mt-16 md:mt-0 overflow-y-auto">
                            ${GENRES.map(g => {
                                const currentCount = SCENARIOS.filter(s => s.genre === g).length;
                                return `
                                <div onclick="setGenre('${g}')" class="px-8 py-5 flex justify-between items-center cursor-pointer transition-all ${state.activeGenre === g ? 'sidebar-item-active' : 'hover:bg-slate-800 text-slate-400'}">
                                    <span class="text-xs font-bold uppercase tracking-widest">${g}</span>
                                    <span class="text-[9px] bg-slate-800 px-2 py-1 rounded opacity-60">${currentCount}/30</span>
                                </div>`;
                            }).join('')}
                        </div>
                    </nav>
                    <main class="flex-grow p-6 md:p-12 mt-16 md:mt-0 overflow-y-auto bg-slate-50">
                        <div class="max-w-6xl mx-auto">
                            <h2 class="text-2xl md:text-3xl font-black text-slate-800 mb-8 border-b pb-4 flex items-center justify-between uppercase">
                                <span>${state.activeGenre}</span>
                                <span class="text-[10px] font-mono text-slate-400 border px-3 py-1 rounded-full bg-white">${filtered.length} CASES LOADED</span>
                            </h2>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                                ${filtered.map(s => `
                                    <div onclick="initCase('${s.id}')" class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all cursor-pointer flex flex-col h-full">
                                        <div class="flex justify-between items-start mb-6">
                                            <div class="text-4xl bg-slate-50 p-4 rounded-2xl shadow-inner">${s.icon}</div>
                                            <div class="text-[9px] font-black text-slate-300 tracking-widest uppercase">${s.id}</div>
                                        </div>
                                        <h3 class="font-black text-slate-800 text-lg mb-1">${s.name}</h3>
                                        <p class="text-[10px] text-slate-400 font-bold mb-8 uppercase tracking-widest leading-relaxed">${s.desc}</p>
                                        <div class="mt-auto pt-4 border-t border-slate-50 text-[10px] font-black text-blue-600 tracking-widest uppercase italic">Execute Training →</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </main>`;
            } else {
                const c = state.activeCase;
                const s = c.steps[state.step];
                root.innerHTML = `
                    <div class="w-full flex flex-col bg-slate-100 h-screen p-2 md:p-4 overflow-hidden">
                        <header class="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center mb-4">
                            <button onclick="state.view='portal';render();" class="text-[9px] font-black text-slate-500 border rounded-xl px-4 py-2 hover:bg-slate-50">◀ BACK</button>
                            <h2 class="font-black text-slate-900 tracking-widest text-[10px] md:text-xs uppercase">${c.name} [${c.id}]</h2>
                            <div class="bg-slate-900 text-white px-6 py-2 rounded-xl font-black italic shadow-xl text-xs">SCORE ${state.score}</div>
                        </header>
                        <div class="flex flex-col md:flex-row gap-4 flex-grow overflow-hidden">
                            <div class="w-full md:w-1/4 bg-white rounded-3xl p-8 border shadow-sm flex flex-col overflow-y-auto">
                                <span class="text-[9px] font-black text-slate-300 uppercase mb-4 tracking-widest">Medical Chart</span>
                                <p class="text-xs md:text-sm font-bold text-slate-600 border-l-4 border-slate-900 pl-4 italic leading-loose">${c.scenario}</p>
                            </div>
                            <div class="flex-grow flex flex-col gap-4 overflow-hidden">
                                <div class="bg-white rounded-3xl p-8 border shadow-sm flex-grow overflow-y-auto">
                                    <span class="text-[9px] font-black text-slate-300 uppercase mb-6 block tracking-widest">Calculation Log</span>
                                    <div class="space-y-3 font-mono text-xs">
                                        ${state.items.map(i => `<div class="flex justify-between border-b border-slate-50 pb-2"><span>${i.n}</span><span class="font-black underline decoration-blue-500">${i.p}</span></div>`).join('')}
                                    </div>
                                </div>
                                <div class="bg-slate-900 p-8 md:p-12 rounded-[2rem] md:rounded-[3rem] shadow-2xl flex justify-center items-center">
                                    ${renderActionButtons(s)}
                                </div>
                            </div>
                            <div class="hidden md:flex w-1/4 bg-slate-800 text-white rounded-3xl p-8 shadow-xl flex-col">
                                <span class="text-[9px] font-black text-slate-500 uppercase mb-10 text-center tracking-[0.2em]">Step Monitor</span>
                                <div class="space-y-8 flex-grow">
                                    ${c.steps.map((step, i) => `<div class="${i === state.step ? 'text-blue-400' : (i < state.step ? 'opacity-30' : 'opacity-10')} text-[10px] font-black transition-all">STEP ${i+1}: ${step.label || 'DONE'}</div>`).join('')}
                                </div>
                                <div class="mt-4 p-5 bg-white/5 rounded-2xl border border-white/10 text-[10px] text-blue-200 font-bold leading-relaxed shadow-inner">💡 ${s.hint || '計算を完了させて終了します'}</div>
                            </div>
                        </div>
                    </div>`;
            }
        }

        function renderActionButtons(s) {
            const btnClass = "bg-blue-600 text-white px-10 py-4 rounded-xl font-black shadow-lg hover:bg-blue-500 transition-all uppercase tracking-widest text-xs md:text-sm";
            if (s.type === 'finish') return `<button onclick="state.view='portal';render();" class="bg-white text-slate-900 px-12 py-4 rounded-xl font-black shadow-xl hover:scale-105 transition-all text-xs tracking-widest">COMPLETE MISSION</button>`;
            if (s.type === 'check') return `<button onclick="state.step++;render();" class="${btnClass}">Execute Check</button>`;
            if (s.type === 'add') return `<button onclick="doAdd('${s.item}', ${s.pts})" class="${btnClass}">Add ${s.pts} pts</button>`;
            if (s.type === 'choice') return `<div class="flex flex-col md:flex-row gap-4 w-full">${s.choices.map(c => `<button onclick="${c.ok ? `doAdd('${c.l}', ${c.p})` : `alert('Error: Incorrect Logic')`}" class="flex-grow py-4 rounded-xl font-black shadow-lg transition-all text-xs ${c.ok ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}">${c.l}</button>`).join('')}</div>`;
        }

        function toggleMobileMenu() { state.isMobileMenuOpen = !state.isMobileMenuOpen; render(); }
        function setGenre(g) { state.activeGenre = g; state.isMobileMenuOpen = false; render(); }
        function initCase(id) {
            const sc = SCENARIOS.find(x => x.id === id);
            state = { view: 'sim', activeGenre: state.activeGenre, activeCase: sc, step: 0, items: [...sc.initial], score: sc.initial.reduce((a,b)=>a+b.p,0), isMobileMenuOpen: false };
            render();
        }
        function doAdd(n, p) { state.items.push({n, p}); state.score += p; state.step++; render(); }

        render();
    </script>
</body>
</html>
